; topsdo configuration - all built-in defaults.
; Copy to one of these locations (later ones override earlier ones):
;   $XDG_CONFIG_HOME/topsdo/config (~/.config/topsdo/config), %APPDATA%\topsdo\config,
;   ~/.topsdo, ./topsdo.conf, ./.topsdo
; or pass it explicitly with: topsdo -c <file> ...   (or set TOPSDO_CONFIG)
; topydo config files work too: [topydo] is read as [topsdo].
; Colors are .NET ConsoleColor names: Black, DarkBlue, DarkGreen, DarkCyan, DarkRed,
; DarkMagenta, DarkYellow, Gray, DarkGray, Blue, Green, Cyan, Red, Magenta, Yellow, White.

[topsdo]
filename = todo.txt
archive_filename = done.txt
default_command = ls
; colors: 1 = on, 0 = off
colors = 1
; identifiers: linenumber or text
identifiers = linenumber
identifier_alphabet = 0123456789abcdefghijklmnopqrstuvwxyz
; move completed items to archive_filename after 'do'
archive = 1
backup_count = 5
ignore_case = 1
; prompt mode command history
history_file = ~/.topsdo_history

[add]
auto_creation_date = 1

[ls]
hide_tags = id,p,ical
hidden_item_tags = h
list_limit = -1
list_format = %I %x %{(}p{)} %s %k %{(}h{)}

[sort]
sort_string = desc:importance,due,desc:priority
group_string =
ignore_weekends = 1

[tags]
tag_due = due
tag_start = t
tag_recurrence = rec
tag_star = star

[dep]
append_parent_projects = 0
append_parent_contexts = 0

[colors]
priority_colors = A:Cyan,B:Yellow,C:Blue
project_color = Red
context_color = Magenta
metadata_color = Green
link_color = DarkCyan
completed_color = DarkGray
overdue_color = Red

[columns]
column_width = 40
column_file = ~/.topsdo_columns
column_format = %I %x %{(}p{)} %s %k %{(}h{)}
focus_background = DarkCyan
cursor_background = DarkGray
mark_background = DarkMagenta

[column_keymap]
<Up> = up
k = up
<Down> = down
j = down
<Left> = prev_column
h = prev_column
<Right> = next_column
l = next_column
<Tab> = next_column
<S-Tab> = prev_column
gg = home
<Home> = home
G = end
<End> = end
<PgUp> = page_up
<C-b> = page_up
<PgDn> = page_down
<C-f> = page_down
<C-u> = half_page_up
<C-d> = half_page_down
0 = first_column
$ = last_column
x = cmd do {}
d = cmd del {}
e = cmd edit {}
u = cmd revert
pp = postpone
ps = postpone_s
pr = pri
pd = cmd depri {}
m = mark
<Space> = mark
<C-a> = mark_all
<Esc> = reset
a = add
A = append
t = tag
: = command_line
/ = search
. = repeat
<Enter> = details
N = new_column
E = edit_column
C = copy_column
D = delete_column
< = swap_left
> = swap_right
r = reload
<F5> = reload
? = help
q = quit

[aliases]
; examples - {} is replaced by the remaining arguments:
; today = ls due:<=today
; top = ls -n {}
; work = ls +work

